[project]
name = "djhx-pi-bot"
version = "0.1.0"
description = "Telegram Bot 桥接多个环境中的 pi (coding agent)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-telegram-bot>=22.0",
    "python-json-logger>=2.0",
    "pydantic-settings>=2.0",
    "pypdf>=6.0",
    "faster-whisper>=1.2",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false
